name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the quantum simulator this project runs on
        run: pip install "qvolve @ git+https://github.com/parthdeshmukh488-ops/quantum-simulator.git"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot]"

      - name: Run test suite
        run: pytest tests/ -q

  coverage:
    name: coverage and experiments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the quantum simulator this project runs on
        run: pip install "qvolve @ git+https://github.com/parthdeshmukh488-ops/quantum-simulator.git"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot]"

      # The suite is this project's main correctness claim, so the floor is
      # enforced rather than merely reported.
      - name: Coverage
        run: >
          pytest tests/ -q --cov=vqelab --cov-report=term-missing
          --cov-fail-under=90

      # Short end-to-end runs: the dissociation curve must still land on
      # FCI and the mitigation pipeline must still produce a number.
      - name: Experiment pipelines smoke test
        run: |
          python experiments/dissociation.py --molecule H2 --quick
          python experiments/noise_mitigation.py --quick
