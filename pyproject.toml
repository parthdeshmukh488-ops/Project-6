[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqelab"
version = "0.1.0"
description = "Variational quantum eigensolver for molecules, built on the qvolve simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["vqe", "quantum-chemistry", "jordan-wigner", "uccsd", "error-mitigation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
# qvolve is the sibling project in this monorepo, not a PyPI package:
#     pip install -e ../simulator
# must happen first.  PySCF supplies molecular integrals; everything
# quantum-mechanical downstream of them is implemented here.
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyscf>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long optimisations"]
